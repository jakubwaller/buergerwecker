[project]
name = "termine-notifier"
version = "0.1.0"
description = "Free email notifier for German municipal appointment systems"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Jakub Waller" }]
dependencies = [
  "flask>=3.1",
  "gunicorn>=22.0",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "freezegun>=1.5",
  "ruff>=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
  "live: hits real Leipzig endpoints; opt-in via LIVE_TESTS=1",
]

[tool.ruff.lint]
# real errors only: syntax, undefined names, broken f-strings. Ruff's wider
# defaults mostly object to semicolons, which is a style opinion, not a bug.
select = ["E9", "F63", "F7", "F82"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
