# Pinned, not derived from the checkout's directory name: containers, network
# and images stay `buergerwecker-*` whatever path the stack is started from.
# Without it, a `cd` through a differently named path starts a second stack
# beside the running one — two pollers mailing from the same DB.
name: buergerwecker

services:
  # No reverse-proxy service: the shared `elternschule-caddy` on the same host
  # fronts every vhost. This `web` container joins the external `web_proxy`
  # network with alias `termine-web`, which Caddy reverse-proxies by name.
  web:
    build: { context: ., dockerfile: Dockerfile.web }
    env_file: .env
    volumes:
      - ./data:/data
      # Push keys (APNS_KEY_P8_FILE, FCM_SERVICE_ACCOUNT_JSON_FILE). Both
      # containers: load_config reads every *_FILE at start, so a path in the
      # shared .env that one of them cannot see stops it, and the web
      # container sends the verification push inside the register request.
      - ./secrets:/run/secrets:ro
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      default: {}
      web_proxy:
        aliases:
          - termine-web

  poller:
    build: { context: ., dockerfile: Dockerfile.poller }
    env_file: .env
    volumes:
      - ./data:/data
      - ./secrets:/run/secrets:ro
    restart: unless-stopped

  backup:
    build: { context: ., dockerfile: Dockerfile.backup }
    environment:
      - DB_PATH=/data/app.db
    volumes:
      # RW (not :ro) so the backup loop can record meta.last_backup_at after
      # each successful snapshot. The script only INSERTs/UPDATEs that one
      # row; the .backup operation itself reads.
      - ./data:/data
      - /mnt/backup:/backup
    restart: unless-stopped

networks:
  web_proxy:
    external: true
