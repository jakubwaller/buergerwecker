# Auto-deploy: every push to main (i.e. every squash-merge) redeploys the VPS.
# The command it runs is the Redeploy step of docs/DEPLOY.md — that file stays
# the runbook; change the command there and here together.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys queue rather than overlap; a newer push deploys after, never during.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check secrets are configured
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          TARGET: ${{ secrets.DEPLOY_SSH_TARGET }}
        run: |
          missing=""
          [ -n "$KEY" ] || missing="$missing DEPLOY_SSH_KEY"
          [ -n "$TARGET" ] || missing="$missing DEPLOY_SSH_TARGET"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — see docs/DEPLOY.md, 'Auto-deploy secrets'."
            exit 1
          fi

      - name: Prepare SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # A key pasted from a phone often arrives with its line breaks
          # collapsed to spaces; rebuild the PEM line structure if so.
          python3 - << 'PY'
          import os, re
          p = os.path.expanduser("~/.ssh/id_deploy")
          raw = open(p).read()
          lines = raw.strip().splitlines()
          if len(lines) <= 3 or any(len(ln) > 100 for ln in lines):
              m = re.match(r"\s*(-----BEGIN [A-Z0-9 ]+-----)(.*?)(-----END [A-Z0-9 ]+-----)\s*$",
                           raw, re.S)
              if m:
                  body = "".join(m.group(2).split())
                  wrapped = [body[i:i + 70] for i in range(0, len(body), 70)]
                  open(p, "w").write("\n".join([m.group(1), *wrapped, m.group(3)]) + "\n")
          PY
          # Fail here with a readable message rather than at ssh time with
          # libcrypto noise (seen on the first live run, 2026-08-31).
          if ! ssh-keygen -y -P '' -f ~/.ssh/id_deploy > /dev/null 2> /tmp/keyerr; then
            # Shape metadata only — counts and marker presence, never content —
            # so a phone-side fix can be made without a blind retry.
            lines=$(wc -l < ~/.ssh/id_deploy)
            bytes=$(wc -c < ~/.ssh/id_deploy)
            begin=$(grep -c -- '-----BEGIN' ~/.ssh/id_deploy || true)
            end=$(grep -c -- '-----END' ~/.ssh/id_deploy || true)
            enc=$(grep -c 'ENCRYPTED' ~/.ssh/id_deploy || true)
            nonascii=$(LC_ALL=C grep -c '[^ -~]' ~/.ssh/id_deploy || true)
            echo "::error::DEPLOY_SSH_KEY is not a usable private key ($(tail -1 /tmp/keyerr)). Shape after repair: $lines lines, $bytes bytes, BEGIN markers: $begin, END markers: $end, ENCRYPTED header: $enc, lines with non-ASCII characters: $nonascii. If ENCRYPTED is 1 or the key has a passphrase, paste an unencrypted deploy key; if markers are 0 or non-ASCII is >0, the paste mangled the text — copy the whole file again including the BEGIN/END lines."
            exit 1
          fi
          echo "IdentityFile ~/.ssh/id_deploy" >> ~/.ssh/config
          echo "Port ${PORT:-22}" >> ~/.ssh/config
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "StrictHostKeyChecking yes" >> ~/.ssh/config
          else
            # Trust-on-first-use: fine for a fresh runner, but a pinned
            # DEPLOY_KNOWN_HOSTS (ssh-keyscan output) is the safer setup.
            echo "StrictHostKeyChecking accept-new" >> ~/.ssh/config
          fi

      - name: Pull and rebuild on the VPS
        env:
          TARGET: ${{ secrets.DEPLOY_SSH_TARGET }}
        run: |
          ssh "$TARGET" 'cd ~/termine-notifier && git pull --ff-only && docker compose up -d --build'

      - name: Verify the VPS runs this commit
        env:
          TARGET: ${{ secrets.DEPLOY_SSH_TARGET }}
        run: |
          deployed=$(ssh "$TARGET" 'cd ~/termine-notifier && git rev-parse HEAD')
          if [ "$deployed" != "$GITHUB_SHA" ]; then
            echo "::error::VPS checkout is at $deployed, expected $GITHUB_SHA"
            exit 1
          fi

      - name: Verify /healthz
        # The apex is the health check; www and termine.jakubwaller.eu only
        # redirect, so probing them reports a healthy deploy as a failure.
        run: |
          sleep 10
          out=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors https://buergerwecker.de/healthz)
          [ "$out" = "ok" ] || { echo "::error::healthz said: $out"; exit 1; }
